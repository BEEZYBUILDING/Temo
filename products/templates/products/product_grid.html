<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMO | Shop Everything</title>
</head>
<body class="bg-gray-100">

    <header class="bg-green-600 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-white text-2xl font-black italic mb-3">TEMO</h1>
            <div class="relative">
                <input id="search-input" type="text" placeholder="Search for items..." 
                       class="w-full p-3 rounded-full outline-none pr-12">
                <button onclick="performSearch()" class="absolute right-3 top-2.5 text-green-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-2 md:p-4">
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
            <p class="text-center col-span-full py-10 text-gray-500">Loading amazing deals...</p>
        </div>
    </main>

    <script>
        // 1. Function to fetch products from your API
        async function loadProducts(query = "") {
            const grid = document.getElementById('product-grid');
            try {
                // This matches your ProductView GET method
                const response = await fetch(`http://127.0.0.1:8000/api/products/?search=${query}`);
                const products = await response.json();

                console.log("Data received:", products); // This helps us debug in the browser

                grid.innerHTML = ""; // Clear the "Loading" message

                if (products.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-center py-10">No items found.</p>`;
                    return;
                }

                products.forEach(product => {
                    // 1. Get the first image or use a placeholder
                    const imageUrl = product.images && product.images.length > 0 
                        ? product.images[0].image_url 
                        : 'https://via.placeholder.com/200?text=No+Image';

                    // 2. Get the price from the first variant
                    const price = product.variants && product.variants.length > 0 
                        ? product.variants[0].price 
                        : '0.00';

                    // 3. Create the HTML for the card
                    const card = `
                        <a href="/product/${product.id}/" class="bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md transition border border-gray-100 flex flex-col">
                            <div class="relative aspect-square">
                                <img src="${imageUrl}" class="w-full h-full object-cover">
                                <div class="absolute top-2 left-2 bg-green-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">
                                    TEMO Choice
                                </div>
                            </div>
                            <div class="p-2 flex-grow">
                                <h3 class="text-xs text-gray-700 line-clamp-2 mb-1 h-8">${product.name}</h3>
                                <div class="flex items-baseline gap-1">
                                    <span class="text-green-700 font-bold text-lg">$${price}</span>
                                    <span class="text-[10px] text-gray-400 line-through">$${(parseFloat(price) * 1.5).toFixed(2)}</span>
                                </div>
                                <div class="mt-1 flex items-center text-[10px] text-orange-500 font-bold">
                                    <span>★★★★☆</span>
                                    <span class="text-gray-400 ml-1 font-normal">(1.2k)</span>
                                </div>
                                <div class="mt-2 bg-green-50 text-green-700 text-[10px] font-bold py-1 px-2 rounded text-center">
                                    FREE SHIPPING
                                </div>
                            </div>
                        </a>
                    `;
                    grid.innerHTML += card;
                });
            } catch (error) {
                console.error("Fetch error:", error);
                grid.innerHTML = `<p class="col-span-full text-center py-10 text-red-500">Something went wrong. Check the console!</p>`;
            }
        }

        // 2. Handle Search
        function performSearch() {
            const query = document.getElementById('search-input').value;
            loadProducts(query);
        }

        // Detect 'Enter' key in search box
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Initial Load
        loadProducts();
    </script>
</body>
</html>
